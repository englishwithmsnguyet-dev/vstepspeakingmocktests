      --yellow: #ffe566;

    * { box-sizing: border-box; margin: 0; padding: 0; }

      color: var(--ink);
      min-height: 100vh;

    button, input, select { font-family: inherit; }

    .tg-btn.yellow:hover:not(:disabled) { background: #facc15; }
    .tg-btn.danger { background: #fef2f2; border-color: #fca5a5; color: #b91c1c; }
    .tg-container { max-width: 1180px; margin: 0 auto; padding: 20px 18px 48px; }
    .tg-auth-wrap {
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;

    .tg-auth-card {
      width: min(440px, 100%); background: #fff; border: 2px solid var(--ink);

    .tg-stats-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));

    .tg-filter-bar {

    .tg-filter-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(165px, 1fr)); gap: 10px;
    }
    .tg-sub-card {
      background: #fff; border: 2px solid var(--ink); border-radius: 14px;

    .tg-sub-top {

    .tg-ai-bar {
      display: flex; justify-content: space-between; align-items: center;
      gap: 10px; flex-wrap: wrap; padding: 10px 12px;
      background: #faf9f6; border: 1.5px solid #e4e4e7; border-radius: 10px; margin-top: 10px;
    }
    .tg-details {
      margin-top: 12px; border: 1.5px solid #d4d4d8; border-radius: 10px; overflow: hidden;
    }
    .tg-details summary {
      padding: 10px 14px; background: #fffbeb; font-weight: 800; font-size: 13.5px; cursor: pointer;

    .tg-grade-row {
      display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px;

    .tg-verdict-bar {
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
      gap: 10px; margin-top: 12px; padding: 10px 12px;
      border-radius: 10px; background: #f8fafc; border: 1.5px solid #cbd5e1;
    }
    .tg-verdict-btns {
      display: flex; gap: 7px; flex-wrap: wrap; align-items: center;
    }
    .tg-btn.approve {
      background: #f0fdf4; border-color: #16a34a; color: #166534;

    .tg-btn.manual {
      background: #f5f3ff; border-color: #7c3aed; color: #5b21b6;

      background: #7c3aed; border-color: #4c1d95; color: #fff;

    .tg-manual-panel {
      margin-top: 12px; padding: 14px 16px; border-radius: 12px;
      background: #faf5ff; border: 2px solid #7c3aed;
    }
    .tg-manual-grid {
      display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: 10px;
    }
    .tg-manual-part-box {
      background: #fff; border: 1.5px solid #ddd6fe; border-radius: 10px; padding: 10px;
      display: flex; flex-direction: column; gap: 6px;
    }
    .tg-textarea {
      width: 100%; border: 1.5px solid #d4d4d8; border-radius: 8px;
      padding: 8px 10px; font-size: 13px; background: #fff; color: var(--ink);
      font-family: inherit; resize: vertical; line-height: 1.5;
    }
    .tg-textarea:focus { outline: none; border-color: #7c3aed; }
    .tg-saved-summary {
      margin-top: 10px; padding: 10px 12px; border-radius: 10px;

    }
    @media (max-width: 820px) {
      .tg-manual-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div id="teacher-root"></div>

  <script src="./speaking-grader-config.js?v=20261126_8h"></script>
  <script src="./speaking-grader.js?v=20261126_asr"></script>
  <script>
    (function () {
      const CFG = window.VSTEP_SPEAKING_GRADER_CONFIG || {};
      const GRADER = window.VstepSpeakingGrader;
      const escapeHtml = GRADER.escapeHtml;
      const formatDateTime = GRADER.formatDateTime;
      const formatRemainingTime = GRADER.formatRemainingTime;
      const AUDIO_BUCKET = "mock-speaking-recordings";
      const RELEASE_HOURS = Number(CFG.releaseDelayHours) || 6;

      let supabaseClient = null;
      function getClient() {
        if (supabaseClient) return supabaseClient;
        const url = GRADER.getBaseUrl();
        const key = GRADER.getAnonKey();
        if (!url || !key || !GRADER.isConfigured() || !window.supabase) return null;
        supabaseClient = window.supabase.createClient(url, key, {
          auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
        });
        return supabaseClient;
      }

      const state = {
        checkingAuth: true,
        authenticated: false,
        teacherEmail: "",
        authError: "",
        dbError: "",
        loading: false,
        flushingQueue: false,
        gradingId: "",
        gradingStepText: "",
        releasingId: "",
        deletingId: "",
        verdictSavingId: "",
        manualOpenId: "",
        manualSavingId: "",
        savedToastId: "",
        savedToastText: "",
        submissions: [],
        searchQuery: "",
        filterClass: "all",
        filterTest: "all",
        filterLevel: "all",
        filterStatus: "all"
      };

      async function getSignedAudioUrls(paths) {
        const client = getClient();
        const map = {};
        if (!client || !Array.isArray(paths)) return map;
        const unique = Array.from(new Set(paths.filter(Boolean)));
        for (let i = 0; i < unique.length; i += 50) {
          try {
            const { data, error } = await client.storage
              .from(AUDIO_BUCKET)
              .createSignedUrls(unique.slice(i, i + 50), 7200);
            if (!error && Array.isArray(data)) {
              data.forEach(it => {
                if (it && it.path && it.signedUrl) map[it.path] = it.signedUrl;
              });
            }
          } catch (e) {}
        }
        return map;
      }

      async function getAccessToken() {
        const client = getClient();
        if (!client) return "";
        const { data } = await client.auth.getSession();
        return data && data.session ? data.session.access_token : "";
      }

      async function loadDashboardData() {
        const client = getClient();
        if (!client) return;
        state.loading = true;
        state.dbError = "";
        render();

        const [subsRes, revsRes] = await Promise.all([
          client
            .from("mock_speaking_submissions")
            .select("*")
            .neq("status", "uploading")
            .order("submitted_at", { ascending: false })
            .limit(300),
          client.from("mock_speaking_ai_reviews").select("*")
        ]);

        if (subsRes.error || revsRes.error) {
          const err = subsRes.error || revsRes.error;
          state.dbError = `Lỗi đọc dữ liệu (${err.code || "DB"}): ${err.message}`;
          state.loading = false;
          render();
          return;
        }

        const subRows = Array.isArray(subsRes.data) ? subsRes.data : [];
        const revRows = Array.isArray(revsRes.data) ? revsRes.data : [];
        const revBySubId = {};
        revRows.forEach(r => {
          if (r && r.submission_id) revBySubId[r.submission_id] = r;
        });

        const allPaths = [];
        subRows.forEach(s => {
          if (s.audio_path_p1) allPaths.push(s.audio_path_p1);
          if (s.audio_path_p2) allPaths.push(s.audio_path_p2);
          if (s.audio_path_p3) allPaths.push(s.audio_path_p3);
        });
        const signedUrls = await getSignedAudioUrls(allPaths);
        const nowMs = Date.now();

        state.submissions = subRows.map(s => {
          const rev = revBySubId[s.id] || null;
          const rj = rev && rev.status === "ready" && rev.review_json ? rev.review_json : null;
          const tOv = rj && rj.teacher_override && typeof rj.teacher_override === "object" ? rj.teacher_override : null;
          const relIso = (rev && rev.release_at) || s.release_at || "";
          const relMs = relIso ? new Date(relIso).getTime() : 0;
          const hasAiParts = Boolean(rj && rj.parts && (rj.parts.part1 || rj.parts.part2 || rj.parts.part3));
          const hasReady = Boolean(rj);
          const isRejectedBlocked = Boolean(
            tOv &&
              tOv.hide_ai_review === true &&
              !tOv.overall_band &&
              !tOv.overall_comment &&
              !(tOv.parts && ["part1", "part2", "part3"].some(k => tOv.parts[k] && (tOv.parts[k].band || tOv.parts[k].comment)))
          );
          const isReleased = hasReady && !isRejectedBlocked && relMs > 0 && relMs <= nowMs;
          const isWaitingRelease = hasReady && !isRejectedBlocked && relMs > nowMs;
          const isSeen = isReleased && Boolean(rev && rev.student_seen_at);

          return {
            id: s.id,
            studentKey: s.student_key || "",
            studentName: s.student_name || "Học viên",
            classCode: s.class_code || "",
            testId: Number(s.test_id) || 1,
            testTitle: s.test_title || `Speaking Mock Test ${String(s.test_id || 1).padStart(2, "0")}`,
            targetLevel: String(s.target_level || "B1").toUpperCase(),
            status: s.status || "",
            submittedAt: s.submitted_at || s.created_at || "",
            releaseAt: relIso,
            audioPaths: { 1: s.audio_path_p1 || "", 2: s.audio_path_p2 || "", 3: s.audio_path_p3 || "" },
            audioUrls: {
              1: s.audio_path_p1 ? signedUrls[s.audio_path_p1] || "" : "",
              2: s.audio_path_p2 ? signedUrls[s.audio_path_p2] || "" : "",
              3: s.audio_path_p3 ? signedUrls[s.audio_path_p3] || "" : ""
            },
            teacherScore: s.teacher_score || "",
            teacherFeedback: s.teacher_feedback || "",
            review: rev,
            reviewJson: rj,
            teacherOverride: tOv,
            teacherDecision: tOv ? String(tOv.decision || "") : "",
            hasAiParts,
            hasReady,
            isRejectedBlocked,
            isReleased,
            isWaitingRelease,
            isSeen
          };
        });

        state.loading = false;
        render();
      }

      async function verifyTeacherSession(user) {
        const client = getClient();
        if (!client || !user) {
          state.checkingAuth = false;
          state.authenticated = false;
          render();
          return;
        }
        const { data: isTeacherFlag, error } = await client.rpc("is_teacher");
        if (error || !isTeacherFlag) {
          state.checkingAuth = false;
          state.authenticated = false;
          state.authError = `Tài khoản ${user.email} chưa được cấp quyền Giáo viên trong bảng public.teachers.`;
          await client.auth.signOut().catch(() => {});
          render();
          return;
        }
        state.checkingAuth = false;
        state.authenticated = true;
        state.teacherEmail = user.email || "";
        state.authError = "";
        await loadDashboardData();
      }

      function getFilteredSubmissions() {
        const q = state.searchQuery.trim().toLowerCase();
        return state.submissions.filter(s => {
          if (q && !s.studentName.toLowerCase().includes(q) && !s.classCode.toLowerCase().includes(q)) return false;
          if (state.filterClass !== "all" && s.classCode !== state.filterClass) return false;
          if (state.filterTest !== "all" && String(s.testId) !== state.filterTest) return false;
          if (state.filterLevel !== "all" && s.targetLevel !== state.filterLevel) return false;
          if (state.filterStatus === "waiting_release" && !s.isWaitingRelease) return false;
          if (state.filterStatus === "unread" && (!s.isReleased || s.isSeen)) return false;
          if (state.filterStatus === "ungraded" && s.hasReady) return false;
          if (state.filterStatus === "ready" && !s.hasReady) return false;
          if (state.filterStatus === "pending_verdict" && (!s.hasAiParts || Boolean(s.teacherDecision))) return false;
          if (state.filterStatus === "approved" && s.teacherDecision !== "approved") return false;
          if (state.filterStatus === "rejected" && s.teacherDecision !== "rejected") return false;
          if (state.filterStatus === "manual" && s.teacherDecision !== "manual") return false;
          return true;
        });
      }

      async function ensurePartWavUpgraded(item, pNum, token) {
        if (!item || !GRADER.convertBlobToCleanWav16k) return "";
        const oldPath = String((item.audioPaths && item.audioPaths[pNum]) || "").trim();
        const signedUrl = String((item.audioUrls && item.audioUrls[pNum]) || "").trim();
        if (!oldPath || !signedUrl || /_studio16k\.wav$/i.test(oldPath)) return "";

        try {
          state.gradingStepText = `Lọc nhiễu & chuẩn hoá Part ${pNum}/3...`;
          render();
          const dlRes = await fetch(signedUrl);
          if (!dlRes.ok) return "";
          const rawBlob = await dlRes.blob();
          const wavBlob = await GRADER.convertBlobToCleanWav16k(rawBlob);
          if (!wavBlob || !String(wavBlob.type || "").includes("wav") || wavBlob.size < 200) return "";

          const prep = await GRADER.callEdgeFunction(
            { action: "teacher_prepare_wav_upgrade", submission_id: item.id, part_num: pNum },
            token
          );
          if (!prep.ok || !prep.signedUrl || !prep.wav_path) return "";

          const putRes = await fetch(prep.signedUrl, {
            method: "PUT",
            headers: { "Content-Type": "audio/wav", "x-upsert": "true" },
            body: wavBlob
          });
          if (!putRes.ok) return "";
          return prep.wav_path;
        } catch (e) {
          return "";
        }
      }

      async function triggerGradeNow(subId) {
        if (!subId || state.gradingId) return;
        const item = state.submissions.find(x => x.id === subId);
        state.gradingId = subId;
        const token = await getAccessToken();
        const partsToRun = [1, 2, 3];

        for (let i = 0; i < partsToRun.length; i++) {
          const pNum = partsToRun[i];
          // Tự động chuyển đổi file .webm cũ sang chuẩn WAV 16kHz PCM (+ tăng âm micro nhỏ) trước khi chấm
          const upgradedPath = await ensurePartWavUpgraded(item, pNum, token);

          state.gradingStepText = `Đang chấm Part ${pNum}/3...`;
          render();
          const payload = {
            action: "grade_now",
            submission_id: subId,
            part_num: pNum,
            reset_existing: i === 0,
            release_now: false
          };
          if (upgradedPath) payload.upgraded_audio_path = upgradedPath;

          let res = await GRADER.callEdgeFunction(payload, token);
          // Tự động thử lại 1 lần nếu AI gặp lỗi JSON hoặc lỗi mạng tạm thời (giữ nguyên các Part đã chấm xong)
          if (!res.ok && /JSON|502|503|timeout|network/i.test(String(res.error || ""))) {
            state.gradingStepText = `Đang thử chấm lại Part ${pNum}/3...`;
            render();
            const retryPayload = { ...payload, reset_existing: false };
            res = await GRADER.callEdgeFunction(retryPayload, token);
          }
          if (!res.ok) {
            state.gradingId = "";
            state.gradingStepText = "";
            render();
            alert(`Lỗi khi chấm Part ${pNum}: ` + (res.error || "Lỗi máy chủ"));
            return;
          }
          if (res.all_done) break;
        }

        state.gradingId = "";
        state.gradingStepText = "";
        await loadDashboardData();
      }

      async function triggerReleaseNow(subId) {
        const client = getClient();
        if (!client || !subId || state.releasingId) return;
        state.releasingId = subId;
        render();
        const { error } = await client.rpc("teacher_release_mock_review_now", { p_submission_id: subId });
        state.releasingId = "";
        if (error) {
          render();
          alert("Không trả bài sớm được: " + error.message);
          return;
        }
        await loadDashboardData();
      }

      async function delayReleaseByHours(subId, extraHours = 2) {
        const client = getClient();
        if (!client || !subId || state.releasingId) return;
        const item = state.items.find(x => x.id === subId);
        if (!item) return;

        const baseMs = Math.max(Date.now(), new Date(item.releaseAt || 0).getTime() || 0);
        const nextIso = new Date(baseMs + extraHours * 3600 * 1000).toISOString();
        const nowIso = new Date().toISOString();

        state.releasingId = subId;
        render();
        try {
          const { error: e1 } = await client
            .from("mock_speaking_submissions")
            .update({
              release_at: nextIso,
              status: item.status === "ready" ? "scheduled" : item.status,
              updated_at: nowIso
            })
            .eq("id", subId);
          if (e1) throw e1;

          const { error: e2 } = await client
            .from("mock_speaking_ai_reviews")
            .update({ release_at: nextIso, student_seen_at: null, updated_at: nowIso })
            .eq("submission_id", subId);
          if (e2) throw e2;

          state.releasingId = "";
          await loadDashboardData();
        } catch (err) {
          state.releasingId = "";
          render();
          alert("Không gia hạn được thời gian trả bài: " + (err && err.message ? err.message : err));
        }
      }

      async function delayFilteredByHours(extraHours = 2) {
        const client = getClient();
        if (!client || state.flushingQueue) return;
        const targets = getFilteredItems();
        if (!targets.length) {
          alert("Không có bài nào trong danh sách đang lọc để gia hạn.");
          return;
        }
        const ok = confirm(
          `Gia hạn thêm +${extraHours} tiếng thời gian trả bài cho ${targets.length} bài đang hiển thị?\n(Các bài đã đến giờ trả sẽ tạm khoá lại thêm ${extraHours} tiếng tính từ bây giờ để Cô chấm xong.)`
        );
        if (!ok) return;

        state.flushingQueue = true;
        render();
        const nowIso = new Date().toISOString();
        let done = 0;
        try {
          for (const item of targets) {
            const baseMs = Math.max(Date.now(), new Date(item.releaseAt || 0).getTime() || 0);
            const nextIso = new Date(baseMs + extraHours * 3600 * 1000).toISOString();
            await client
              .from("mock_speaking_submissions")
              .update({
                release_at: nextIso,
                status: item.status === "ready" ? "scheduled" : item.status,
                updated_at: nowIso
              })
              .eq("id", item.id);
            await client
              .from("mock_speaking_ai_reviews")
              .update({ release_at: nextIso, student_seen_at: null, updated_at: nowIso })
              .eq("submission_id", item.id);
            done++;
          }
          state.flushingQueue = false;
          await loadDashboardData();
          alert(`✅ Đã gia hạn thêm +${extraHours} tiếng cho ${done} bài thành công!`);
        } catch (err) {
          state.flushingQueue = false;
          render();
          alert("Lỗi khi gia hạn hàng loạt: " + (err && err.message ? err.message : err));
        }
      }

      async function triggerFlushQueue() {
        if (state.flushingQueue) return;
        state.flushingQueue = true;
        render();
        const token = await getAccessToken();
        const res = await GRADER.callEdgeFunction({ action: "process_queue", batch_size: 2 }, token);
        state.flushingQueue = false;
        if (!res.ok) {
          render();
          alert("Lỗi chạy hàng đợi: " + (res.error || "Không rõ"));
          return;
        }
        await loadDashboardData();
        alert(`Đã xử lý ${res.processed || 0} bài chờ: thành công ${res.succeeded || 0}, lỗi ${res.failed || 0}.`);
      }

      const VSTEP_BAND_OPTIONS = [
        "",
        "Chưa đạt B1",
        "Xấp xỉ B1",
        "Đạt B1",
        "Xấp xỉ B2",
        "Đạt B2",
        "Xấp xỉ C1",
        "Đạt C1"
      ];

      function scoreToBandHelper(scoreVal) {
        const n = Number(scoreVal);
        if (!Number.isFinite(n) || scoreVal === "" || scoreVal === null || scoreVal === undefined) return "";
        const r = Math.round(Math.max(0, Math.min(10, n)) * 4) / 4;
        if (r >= 9.0) return "Đạt C1";
        if (r >= 8.75) return "Xấp xỉ C1";
        if (r >= 6.0) return "Đạt B2";
        if (r >= 5.75) return "Xấp xỉ B2";
        if (r >= 4.0) return "Đạt B1";
        if (r >= 3.75) return "Xấp xỉ B1";
        return "Chưa đạt B1";
      }

      async function setAiVerdict(subId, decision) {
        const client = getClient();
        const item = state.submissions.find(x => x.id === subId);
        if (!client || !item || !item.reviewJson || state.verdictSavingId) return;

        state.verdictSavingId = subId;
        render();

        const nowIso = new Date().toISOString();
        const existingJson = JSON.parse(JSON.stringify(item.reviewJson));
        const prevOv = existingJson.teacher_override && typeof existingJson.teacher_override === "object"
          ? existingJson.teacher_override
          : {};

        existingJson.teacher_override = {
          ...prevOv,
          decision,
          hide_ai_review: decision === "rejected",
          reviewed_by: state.teacherEmail,
          reviewed_at: nowIso
        };

        const { error } = await client
          .from("mock_speaking_ai_reviews")
          .update({
            review_json: existingJson,
            updated_at: nowIso
          })
          .eq("submission_id", subId);

        state.verdictSavingId = "";
        if (error) {
          render();
          alert("Không lưu được quyết định duyệt AI: " + error.message);
          return;
        }

        if (decision === "rejected") {
          // Tự động mở khung Giáo viên tự chấm để cô nhập bài chấm thay thế ngay
          state.manualOpenId = subId;
        }
        state.savedToastId = subId;
        state.savedToastText =
          decision === "approved"
            ? "✅ Đã chọn ĐỒNG Ý với bài chấm AI!"
            : "❌ Đã chọn KHÔNG ĐỒNG Ý — bài AI đã được ẩn với học viên. Bạn có thể tự chấm bên dưới!";
        await loadDashboardData();
        setTimeout(() => {
          if (state.savedToastId === subId) {
            state.savedToastId = "";
            state.savedToastText = "";
            render();
          }
        }, 3500);
      }

      async function saveTeacherManualGrade(subId, releaseNow) {
        const client = getClient();
        const item = state.submissions.find(x => x.id === subId);
        if (!client || !item || state.manualSavingId) return;

        const val = id => (document.getElementById(id)?.value || "").trim();
        const parseOptScore = raw => {
          if (!raw) return null;
          const n = Number(raw.replace(",", "."));
          if (!Number.isFinite(n)) return null;
          return Math.round(Math.max(0, Math.min(10, n)) * 4) / 4;
        };

        const overallScore = parseOptScore(val(`tg-man-score-${subId}`));
        const overallBand = val(`tg-man-band-${subId}`) || (overallScore !== null ? scoreToBandHelper(overallScore) : "");
        const overallComment = val(`tg-man-comment-${subId}`);
        const hideAiEl = document.getElementById(`tg-man-hide-ai-${subId}`);
        const hideAi = hideAiEl ? Boolean(hideAiEl.checked) : !item.hasAiParts;

        const parts = {};
        [1, 2, 3].forEach(n => {
          const pScore = parseOptScore(val(`tg-man-p${n}-score-${subId}`));
          const pBand = val(`tg-man-p${n}-band-${subId}`) || (pScore !== null ? scoreToBandHelper(pScore) : "");
          const pComment = val(`tg-man-p${n}-comment-${subId}`);
          parts[`part${n}`] = {
            band: pBand,
            score: pScore,
            comment: pComment
          };
        });

        const hasAnyContent =
          Boolean(overallBand || overallComment || overallScore !== null) ||
          ["part1", "part2", "part3"].some(k => parts[k].band || parts[k].comment || parts[k].score !== null);

        if (!hasAnyContent) {
          alert("Vui lòng chọn ít nhất Mức đạt hoặc nhập nhận xét của Giáo viên trước khi lưu.");
          return;
        }

        state.manualSavingId = subId;
        render();

        const nowIso = new Date().toISOString();
        const baseJson = item.reviewJson
          ? JSON.parse(JSON.stringify(item.reviewJson))
          : {
              target_level: item.targetLevel || "B1",
              estimated_band: overallBand,
              overall_comment: overallComment,
              overall_score: overallScore
            };

        baseJson.teacher_override = {
          decision: "manual",
          hide_ai_review: hideAi,
          reviewed_by: state.teacherEmail,
          reviewed_at: nowIso,
          overall_band: overallBand,
          overall_score: overallScore,
          overall_comment: overallComment,
          parts
        };

        if (!item.hasAiParts) {
          baseJson.estimated_band = overallBand;
          baseJson.overall_comment = overallComment;
          if (overallScore !== null) baseJson.overall_score = overallScore;
        }

        const existingRelIso = item.releaseAt || new Date(Date.now() + RELEASE_HOURS * 3600 * 1000).toISOString();
        const nextReleaseIso = releaseNow ? nowIso : existingRelIso;
        const isAlreadyReleased = new Date(nextReleaseIso).getTime() <= Date.now();

        const { error: revErr } = await client.from("mock_speaking_ai_reviews").upsert(
          {
            id: item.id,
            submission_id: item.id,
            student_key: item.studentKey || `${item.studentName.trim().toLowerCase()}__${(item.classCode || "").toUpperCase()}`,
            student_name: item.studentName,
            class_code: item.classCode || "",
            test_id: item.testId,
            target_level: item.targetLevel || "B1",
            status: "ready",
            release_at: nextReleaseIso,
            review_json: baseJson,
            error_message: "",
            student_seen_at: releaseNow ? null : (item.review && item.review.student_seen_at) || null,
            updated_at: nowIso
          },
          { onConflict: "id" }
        );

        if (revErr) {
          state.manualSavingId = "";
          render();
          alert("Lỗi lưu bài chấm của Giáo viên: " + revErr.message);
          return;
        }

        const teacherScoreLabel = overallBand || (overallScore !== null ? `${overallScore.toFixed(2)}/10` : "");
        const { error: subErr } = await client
          .from("mock_speaking_submissions")
          .update({
            teacher_score: teacherScoreLabel,
            teacher_feedback: overallComment,
            release_at: nextReleaseIso,
            status: isAlreadyReleased ? "ready" : "scheduled",
            updated_at: nowIso
          })
          .eq("id", subId);

        state.manualSavingId = "";
        if (subErr) {
          render();
          alert("Đã lưu bài chấm nhưng lỗi cập nhật bảng nộp bài: " + subErr.message);
          return;
        }

        state.manualOpenId = "";
        state.savedToastId = subId;
        state.savedToastText = releaseNow
          ? "⚡ Đã lưu bài chấm của Giáo viên và TRẢ BÀI NGAY cho học viên!"
          : "💾 Đã lưu bài chấm của Giáo viên!";
        await loadDashboardData();
        setTimeout(() => {
          if (state.savedToastId === subId) {
            state.savedToastId = "";
            state.savedToastText = "";
            render();
          }
        }, 3500);
      }

      async function deleteSubmission(subId) {
        const client = getClient();
        const item = state.submissions.find(x => x.id === subId);
        if (!client || !item || state.deletingId) return;
        if (!confirm(`Xoá vĩnh viễn bài nộp "${item.testTitle}" của "${item.studentName}" để học viên làm lại?`)) {
          return;
        }
        state.deletingId = subId;
        render();
        try {
          const paths = [item.audioPaths[1], item.audioPaths[2], item.audioPaths[3]].filter(Boolean);
          if (paths.length > 0) {
            await client.storage.from(AUDIO_BUCKET).remove(paths).catch(() => {});
          }
          const { error } = await client.from("mock_speaking_submissions").delete().eq("id", subId);
          if (error) throw error;
          state.deletingId = "";
          await loadDashboardData();
        } catch (err) {
          state.deletingId = "";
          render();
          alert("Không xoá được bài nộp: " + (err && err.message ? err.message : "Lỗi"));
        }
      }

      function exportCsv(rows) {
        const cell = v => `"${String(v ?? "").replace(/"/g, '""')}"`;
        const header = [
          "Học viên", "Lớp", "Đề thi", "Mục tiêu", "Quyết định GV", "Đánh giá tổng (AI)", "Điểm tổng AI (GV)",
          "Part 1", "Part 2", "Part 3", "Trạng thái đọc", "Thời gian nộp",
          "Mức đạt (GV tự chấm)", "Điểm (GV tự chấm)", "Nhận xét GV"
        ];
        const lines = [header.map(cell).join(",")];
        rows.forEach(s => {
          const rj = s.reviewJson || {};
          const parts = rj.parts || {};
          const tOv = s.teacherOverride || {};
          const verdictLabel =
            s.teacherDecision === "approved"
              ? "Đồng ý AI"
              : s.teacherDecision === "rejected"
                ? "Không đồng ý AI"
                : s.teacherDecision === "manual"
                  ? "GV tự chấm"
                  : s.hasAiParts
                    ? "Chưa duyệt AI"
                    : "—";
          const readStatus = s.isRejectedBlocked
            ? "Đã ẩn bài AI"
            : s.isReleased
              ? s.isSeen
                ? "Đã đọc"
                : "Chưa đọc"
              : s.hasReady
                ? "Chờ tới hạn 6h"
                : "Chưa chấm";
          lines.push([
            s.studentName,
            s.classCode || "—",
            s.testTitle,
            s.targetLevel,
            verdictLabel,
            rj.estimated_band || "",
            rj.overall_score !== undefined && rj.overall_score !== null ? Number(rj.overall_score).toFixed(2) : "",
            parts.part1 && !parts.part1.skipped ? parts.part1.estimated_band : "Trống",
            parts.part2 && !parts.part2.skipped ? parts.part2.estimated_band : "Trống",
            parts.part3 && !parts.part3.skipped ? parts.part3.estimated_band : "Trống",
            readStatus,
            formatDateTime(s.submittedAt),
            tOv.overall_band || s.teacherScore || "",
            tOv.overall_score !== undefined && tOv.overall_score !== null ? Number(tOv.overall_score).toFixed(2) : "",
            tOv.overall_comment || s.teacherFeedback || ""
          ].map(cell).join(","));
        });
        const blob = new Blob(["\uFEFF" + lines.join("\n")], { type: "text/csv;charset=utf-8;" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `bao-cao-vstep-speaking-mock-${new Date().toISOString().slice(0, 10)}.csv`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      }

              <button type="button" class="tg-btn" data-toggle-manual="${escapeHtml(s.id)}" style="padding:5px 10px;font-size:12px;">✕ Đóng</button>
            </div>

            <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:10px;">
              <div style="min-width:200px;flex:1;">
                <label style="display:block;font-size:11.5px;font-weight:800;color:#5b21b6;margin-bottom:4px;">Mức đạt tổng (hiển thị cho học viên)</label>
                <select class="tg-input" style="width:100%;" id="tg-man-band-${escapeHtml(s.id)}">
                  ${renderBandOptions(curBand)}
                </select>
              </div>
              <div style="width:185px;">
                <label style="display:block;font-size:11.5px;font-weight:800;color:#5b21b6;margin-bottom:4px;">Điểm tổng GV (0–10, ẩn với HV)</label>
                <input
                  type="number"
                  step="0.25"
                  min="0"
                  max="10"
                  class="tg-input"
                  style="width:100%;"
                  id="tg-man-score-${escapeHtml(s.id)}"
                  data-sync-band="tg-man-band-${escapeHtml(s.id)}"
                  placeholder="VD: 5.50"
                  value="${escapeHtml(curScore)}"
                />
              </div>
            </div>

            <div style="margin-bottom:10px;">
              <label style="display:block;font-size:11.5px;font-weight:800;color:#5b21b6;margin-bottom:4px;">Nhận xét tổng quan của Cô Nguyệt</label>
              <textarea
                rows="3"
                class="tg-textarea"
                id="tg-man-comment-${escapeHtml(s.id)}"
                placeholder="Nhập nhận xét tổng quan, điểm mạnh và trọng tâm cần cải thiện cho học viên..."
              >${escapeHtml(curComment)}</textarea>
            </div>

            <div class="tg-manual-grid">${partInputs}</div>

            <label style="display:flex;align-items:center;gap:8px;margin-top:12px;font-size:12.5px;font-weight:700;color:#3f3f46;cursor:pointer;">
              <input type="checkbox" id="tg-man-hide-ai-${escapeHtml(s.id)}" ${defaultHideAi ? "checked" : ""} style="width:16px;height:16px;" />
              <span>Ẩn bài chấm của AI với học viên (chỉ hiển thị bài chấm của Giáo viên)</span>
            </label>

            <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;">
              <button type="button" class="tg-btn manual active" data-save-manual="${escapeHtml(s.id)}" ${isSaving ? "disabled" : ""}>
                ${isSaving ? "⏳ Đang lưu..." : "💾 Lưu bài chấm GV"}
              </button>
              <button type="button" class="tg-btn yellow" data-save-manual-release="${escapeHtml(s.id)}" ${isSaving ? "disabled" : ""}>
                ${isSaving ? "⏳ Đang lưu..." : "⚡ Lưu & Trả bài ngay cho học viên"}
              </button>
            </div>
          </div>
        `;
      }

      function renderSubmissionCard(s) {
        const rj = s.reviewJson;
        const tOv = s.teacherOverride;
        const isGrading = state.gradingId === s.id;
        const isReleasing = state.releasingId === s.id;
        const isDeleting = state.deletingId === s.id;
        const isVerdictBusy = state.verdictSavingId === s.id;
        const isManualOpen = state.manualOpenId === s.id;
        const band = rj ? rj.estimated_band || "" : "";
        const overallScore = rj && rj.overall_score !== undefined && rj.overall_score !== null ? Number(rj.overall_score) : null;
        const remain = s.isWaitingRelease ? formatRemainingTime(s.releaseAt) : "";

        let statusText = `<span style="font-size:12.5px;color:#52525b;font-weight:700;">⏳ Đang chờ chấm tự động (trả sau ${RELEASE_HOURS} tiếng)</span>`;
        if (s.isRejectedBlocked) {
          statusText = `<span style="font-size:12.5px;color:#b91c1c;font-weight:800;">❌ GV đã chọn KHÔNG ĐỒNG Ý bài AI — đang ẩn với học viên cho tới khi GV tự chấm hoặc chấm lại</span>`;
        } else if (s.isWaitingRelease) {
          statusText = `<span style="font-size:12.5px;color:#92400e;font-weight:800;">⏳ Đã chấm xong · Hẹn trả lúc ${escapeHtml(formatDateTime(s.releaseAt))} (còn ${escapeHtml(remain)})</span>`;
        } else if (s.isReleased) {
          statusText = `<span style="font-size:12.5px;color:#166534;font-weight:800;">✅ Đã trả bài sửa (${escapeHtml(formatDateTime(s.releaseAt))}) · ${s.isSeen ? "✓ Học viên đã đọc" : "● Học viên chưa đọc"}</span>`;
        } else if (s.status === "no_audio" || (s.review && s.review.status === "no_audio")) {
          statusText = `<span style="font-size:12.5px;color:#b91c1c;font-weight:800;">⚠️ Bài nộp thiếu tệp âm thanh hợp lệ.</span>`;
        } else if (s.review && s.review.status === "error") {
          statusText = `<span style="font-size:12.5px;color:#b45309;font-weight:800;">🔄 Lỗi tạm thời (lần thử ${s.review.retry_count || 1}/20): ${escapeHtml((s.review.error_message || "").slice(0, 140))}</span>`;
        }

        let verdictBadge = "";
        if (s.teacherDecision === "approved") {
          verdictBadge = `<span class="sg-badge band-achieved">✅ GV đồng ý AI</span>`;
        } else if (s.teacherDecision === "rejected") {
          verdictBadge = `<span class="sg-badge band-below">❌ GV không đồng ý AI</span>`;
        } else if (s.teacherDecision === "manual") {
          verdictBadge = `<span class="sg-badge" style="background:#f5f3ff;border-color:#7c3aed;color:#5b21b6;">👩‍🏫 GV tự chấm${tOv && tOv.overall_band ? `: ${escapeHtml(tOv.overall_band)}` : ""}</span>`;
        }

        const audioBoxes = [1, 2, 3]
          .map(pNum => {
            const url = s.audioUrls[pNum];
            const path = s.audioPaths[pNum];
            const partName = pNum === 1 ? "Part 1 · Social Interaction" : pNum === 2 ? "Part 2 · Solution Discussion" : "Part 3 · Topic Development";
            return `
              <div class="tg-audio-box">
                <div style="font-size:12px;font-weight:800;color:#18181b;">🎙️ ${partName}</div>
                ${
                  url
                    ? `<audio controls preload="metadata" src="${escapeHtml(url)}"></audio>`
                    : path
                      ? `<div style="font-size:12px;color:#b45309;margin-top:6px;">Chưa tải được link nghe — thử Làm mới.</div>`
                      : `<div style="font-size:12px;color:#71717a;margin-top:6px;"><em>(Không có bản ghi âm phần này)</em></div>`
                }
              </div>
            `;
          })
          .join("");

        return `
          <div class="tg-sub-card">
            <div class="tg-sub-top">
              <div style="display:flex;align-items:center;gap:7px;flex-wrap:wrap;">
                <strong style="font-size:16px;">${escapeHtml(s.studentName)}</strong>
                ${s.classCode ? `<span class="sg-badge">${escapeHtml(s.classCode)}</span>` : ""}
                <span class="sg-badge" style="background:#eff6ff;border-color:#3b82f6;color:#1d4ed8;">${escapeHtml(s.testTitle)}</span>
                <span class="sg-badge">Mục tiêu ${escapeHtml(s.targetLevel)}</span>
                ${band ? `<span class="sg-badge ${band.includes("Chưa đạt") ? "band-below" : band.includes("Xấp xỉ") ? "band-approx" : "band-achieved"}">${escapeHtml(band)}</span>` : ""}
                ${overallScore !== null && Number.isFinite(overallScore) ? `<span class="sg-badge teacher-score">Điểm AI (GV): ${overallScore.toFixed(2)}/10</span>` : ""}
                ${verdictBadge}
              </div>
              <div style="font-size:12px;color:#52525b;font-weight:600;">
                Nộp lúc ${escapeHtml(formatDateTime(s.submittedAt))}
              </div>
            </div>

            <div class="tg-audio-grid">${audioBoxes}</div>

            <div class="tg-ai-bar">
              <div>${statusText}</div>
              <div style="display:flex;gap:8px;flex-wrap:wrap;">
                ${
                  s.isWaitingRelease
                    ? `<button type="button" class="tg-btn yellow" data-release="${escapeHtml(s.id)}" ${isReleasing ? "disabled" : ""}>
                        ${isReleasing ? "Đang trả..." : "⚡ Trả bài sửa ngay"}
                      </button>`
                    : ""
                }
                <button type="button" class="tg-btn" data-delay="${escapeHtml(s.id)}" ${isReleasing ? "disabled" : ""} title="Lùi thời gian trả bài thêm 2 tiếng">
                  ${isReleasing ? "Đang lùi..." : "⏰ +2 tiếng"}
                </button>
                <button type="button" class="tg-btn" data-grade="${escapeHtml(s.id)}" ${isGrading ? "disabled" : ""}>
                  ${isGrading ? `⏳ ${escapeHtml(state.gradingStepText || "Đang chấm...")}` : s.hasAiParts ? "↻ Chấm lại AI" : "✨ Tạo bài sửa AI"}
                </button>
                <button type="button" class="tg-btn danger" data-delete="${escapeHtml(s.id)}" ${isDeleting ? "disabled" : ""}>
                  ${isDeleting ? "Đang xoá..." : "🗑️ Xoá bài"}
                </button>
              </div>
            </div>

            <div class="tg-verdict-bar">
              <div style="font-size:12.5px;font-weight:800;color:#1e293b;">
                ⚖️ Thẩm định của Giáo viên:
              </div>
              <div class="tg-verdict-btns">
                ${
                  s.hasAiParts
                    ? `<button
                        type="button"
                        class="tg-btn approve ${s.teacherDecision === "approved" ? "active" : ""}"
                        data-verdict-approve="${escapeHtml(s.id)}"
                        ${isVerdictBusy ? "disabled" : ""}
                      >
                        ✅ Đồng ý với AI
                      </button>
                      <button
                        type="button"
                        class="tg-btn reject ${s.teacherDecision === "rejected" ? "active" : ""}"
                        data-verdict-reject="${escapeHtml(s.id)}"
                        ${isVerdictBusy ? "disabled" : ""}
                      >
                        ❌ Không đồng ý với AI
                      </button>`
                    : ""
                }
                <button
                  type="button"
                  class="tg-btn manual ${isManualOpen || s.teacherDecision === "manual" ? "active" : ""}"
                  data-toggle-manual="${escapeHtml(s.id)}"
                >
                  ✍️ ${s.teacherDecision === "manual" ? "Sửa bài GV tự chấm" : "Giáo viên tự chấm"}
                </button>
              </div>
            </div>

            ${
              state.savedToastId === s.id && state.savedToastText
                ? `<div class="sg-alert success" style="margin-top:10px;">${escapeHtml(state.savedToastText)}</div>`
                : ""
            }

            ${
              !isManualOpen && (s.teacherScore || s.teacherFeedback)
                ? `<div class="tg-saved-summary">
                    <strong>👩‍🏫 Kết quả GV đã lưu${s.teacherScore ? ` · ${escapeHtml(s.teacherScore)}` : ""}${
                      tOv && tOv.overall_score !== undefined && tOv.overall_score !== null ? ` (${Number(tOv.overall_score).toFixed(2)}/10)` : ""
                    }:</strong>
                    ${s.teacherFeedback ? `<div style="margin-top:4px;white-space:pre-line;">${escapeHtml(s.teacherFeedback)}</div>` : ""}
                  </div>`
                : ""
            }

            ${isManualOpen ? renderManualGradingPanel(s) : ""}

            ${
              s.hasReady
                ? `<details class="tg-details">
                    <summary>📝 Xem chi tiết bài sửa (Part 1, Part 2, Part 3 · ${escapeHtml(band || (tOv && tOv.overall_band) || "")})</summary>
                    <div style="padding:12px;">
                      ${GRADER.renderMockReviewHtml(rj, { targetLevel: s.targetLevel, isTeacherView: true })}
                    </div>
                  </details>`
                : ""
            }
          </div>
        `;
      }

      function render() {
        const root = document.getElementById("teacher-root");
        if (!root) return;
        if (state.checkingAuth) {
          root.innerHTML = `<div class="tg-auth-wrap"><div class="tg-auth-card" style="text-align:center;">Đang kiểm tra đăng nhập Giáo viên...</div></div>`;
          return;
        }
        root.innerHTML = state.authenticated ? renderDashboard() : renderLoginView();
        bindEvents();
      }

      function bindEvents() {
        const btnGoogle = document.getElementById("tg-btn-google");
        if (btnGoogle) {
          btnGoogle.onclick = async () => {
            const client = getClient();
            if (!client) return;
            const { error } = await client.auth.signInWithOAuth({
              provider: "google",
              options: { redirectTo: window.location.origin + window.location.pathname, queryParams: { prompt: "select_account" } }
            });
            if (error) {
              state.authError = error.message;
              render();
            }
          };
        }

        const loginForm = document.getElementById("tg-login-form");
        if (loginForm) {
          loginForm.onsubmit = async e => {
            e.preventDefault();
            const client = getClient();
            if (!client) return;
            const email = (document.getElementById("tg-inp-email")?.value || "").trim();
            const password = (document.getElementById("tg-inp-pass")?.value || "").trim();
            const { data, error } = await client.auth.signInWithPassword({ email, password });
            if (error) {
              state.authError = "Sai email hoặc mật khẩu: " + error.message;
              render();
              return;
            }
            if (data && data.user) await verifyTeacherSession(data.user);
          };
        }

        const btnLogout = document.getElementById("tg-btn-logout");
        if (btnLogout) {
          btnLogout.onclick = async () => {
            const client = getClient();
            if (client) await client.auth.signOut().catch(() => {});
            state.authenticated = false;
            state.submissions = [];
            render();
          };
        }

        const btnRefresh = document.getElementById("tg-btn-refresh");
        if (btnRefresh) btnRefresh.onclick = () => loadDashboardData();

        const btnFlush = document.getElementById("tg-btn-flush");
        if (btnFlush) btnFlush.onclick = () => triggerFlushQueue();

        const btnExport = document.getElementById("tg-btn-export");
        if (btnExport) btnExport.onclick = () => exportCsv(getFilteredSubmissions());

        const searchEl = document.getElementById("tg-search");
        if (searchEl) {
          searchEl.oninput = e => {
            state.searchQuery = e.target.value;
            const pos = e.target.selectionStart;
            render();
            const next = document.getElementById("tg-search");
            if (next) { next.focus(); next.setSelectionRange(pos, pos); }
          };
        }

        const bindSel = (id, key) => {
          const el = document.getElementById(id);
          if (el) el.onchange = e => { state[key] = e.target.value; render(); };
        };
        bindSel("tg-sel-class", "filterClass");
        bindSel("tg-sel-test", "filterTest");
        bindSel("tg-sel-level", "filterLevel");
        bindSel("tg-sel-status", "filterStatus");

        const delayAllBtn = document.getElementById("tg-btn-delay-all");
        if (delayAllBtn) delayAllBtn.onclick = () => delayFilteredByHours(2);

        document.querySelectorAll("[data-grade]").forEach(b => (b.onclick = () => triggerGradeNow(b.getAttribute("data-grade"))));
        document.querySelectorAll("[data-release]").forEach(b => (b.onclick = () => triggerReleaseNow(b.getAttribute("data-release"))));
        document.querySelectorAll("[data-delay]").forEach(b => (b.onclick = () => delayReleaseByHours(b.getAttribute("data-delay"), 2)));
        document.querySelectorAll("[data-delete]").forEach(b => (b.onclick = () => deleteSubmission(b.getAttribute("data-delete"))));
        document.querySelectorAll("[data-verdict-approve]").forEach(b => (b.onclick = () => setAiVerdict(b.getAttribute("data-verdict-approve"), "approved")));
        document.querySelectorAll("[data-verdict-reject]").forEach(b => (b.onclick = () => setAiVerdict(b.getAttribute("data-verdict-reject"), "rejected")));
        document.querySelectorAll("[data-toggle-manual]").forEach(b => {
          b.onclick = () => {
            const id = b.getAttribute("data-toggle-manual");
            state.manualOpenId = state.manualOpenId === id ? "" : id;
            render();
          };
        });
        document.querySelectorAll("[data-save-manual]").forEach(b => (b.onclick = () => saveTeacherManualGrade(b.getAttribute("data-save-manual"), false)));
        document.querySelectorAll("[data-save-manual-release]").forEach(b => (b.onclick = () => saveTeacherManualGrade(b.getAttribute("data-save-manual-release"), true)));
        document.querySelectorAll("[data-sync-band]").forEach(inp => {
          inp.oninput = () => {
            const targetId = inp.getAttribute("data-sync-band");
            const sel = targetId ? document.getElementById(targetId) : null;
            const band = scoreToBandHelper(inp.value);
            if (sel && band) sel.value = band;
          };
        });
      }

      window.addEventListener("DOMContentLoaded", async () => {
        const client = getClient();
        if (!client) {
          state.checkingAuth = false;
          render();
          return;
        }
        render();
        const { data } = await client.auth.getSession();
        if (data && data.session && data.session.user) {
          await verifyTeacherSession(data.session.user);
        } else {
          state.checkingAuth = false;
          render();
        }
        client.auth.onAuthStateChange(async (event, session) => {
          if (event === "SIGNED_IN" && session && session.user && !state.authenticated) {
            await verifyTeacherSession(session.user);
          }
        });
      });
    })();
  </script>
</body>
</html>
